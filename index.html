<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Shop</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weekly Shop">
<meta name="theme-color" content="#f4f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1713" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#14251d; --dim:#5d6f64; --line:#dfe5dc;
  --accent:#1f6f4a; --accent-ink:#ffffff; --accent-soft:#e3f1e8;
  --hl:#ffe94a; --hl-soft:#fff6b8; --hl-ink:#5a4a00;
  --danger:#b3261e; --danger-soft:#fbe9e7; --ok-soft:#dff3e6;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1713; --card:#17221c; --ink:#eaf2ec; --dim:#93a79a; --line:#25352b;
    --accent:#4cc38a; --accent-ink:#07251a; --accent-soft:#1a3226;
    --hl:#ffd60a; --hl-soft:#3a3410; --hl-ink:#ffe680;
    --danger:#ff8a80; --danger-soft:#3a1f1c; --ok-soft:#173326;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none}}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;margin:0;letter-spacing:-.01em}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.back{border:0;background:var(--card);color:var(--accent);font-weight:700;font-size:15px;
  padding:9px 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.bar h1{font-size:21px;flex:1}
.sub{color:var(--dim);font-size:13px;margin:-6px 0 14px}

/* home */
.brand{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 18px}
.brand h1{font-size:32px;line-height:1.05;font-weight:800}
.brand h1 span{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 3px;margin:0 -3px}
.gear{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;color:var(--ink);font:inherit}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px}
.tile .tt{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:800;font-size:19px;margin-top:12px}
.tile .ts{font-size:12.5px;color:var(--dim);margin-top:2px}
.tile.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.main .ts{color:inherit;opacity:.82}
.syncline{margin-top:18px;text-align:center;font-size:12.5px;color:var(--dim)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:8px}
.hint{font-size:12.5px;color:var(--dim);margin:6px 0 0}
label.l{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
textarea{resize:vertical;min-height:120px;line-height:1.35}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.row2{display:flex;gap:10px}.row2>*{flex:1}.row2>.narrow{flex:0 0 96px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:800;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.btn.small{padding:9px 12px;font-size:14px;width:auto}
.btn:disabled{opacity:.5}
.stack{display:flex;flex-direction:column;gap:10px}
.ok{background:var(--ok-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;margin:0 0 14px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.warn{background:var(--hl-soft);color:var(--hl-ink);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px;font-weight:600}
.empty{text-align:center;color:var(--dim);padding:46px 16px}
.empty .big{font-size:38px;margin-bottom:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:15px}
.switch input{width:48px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:20px;position:relative;cursor:pointer;flex:none;transition:.15s}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(20px)}

/* shopping */
.aisle{margin:0 0 14px}
.aisle h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 6px 4px;display:flex;justify-content:space-between}
.aisle.unknown h3{color:var(--hl-ink)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:50px;cursor:pointer}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent)}
.item .nm{flex:1;font-size:16.5px;overflow-wrap:anywhere}
.item .nm::first-letter,.rcp li::first-letter{text-transform:uppercase}
.item .qty{font-weight:800;font-size:13px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.item.done .nm{text-decoration:line-through;color:var(--dim)}
.item.done{opacity:.7}
.item.unk{background:var(--hl-soft)}
.item.unk{flex-wrap:wrap;cursor:default}
.item.unk .nm{flex:1 1 100%}
.item.unk select{flex:1 1 100%;width:100%;padding:9px 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 14px;font:inherit;font-size:14.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--hl);border-color:var(--hl);color:#2d2600;font-weight:700}
.chip .x{color:var(--danger);font-weight:800}

/* planner */
.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:13px 14px;cursor:pointer}
.mnum{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.meal.filled .mnum{background:var(--accent);color:var(--accent-ink)}
.mtxt{flex:1;min-width:0}
.mt{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:12.5px;color:var(--dim);display:block}
.chev{color:var(--dim);transition:.15s}.meal.open .chev{transform:rotate(90deg)}
.mbody{display:none;padding:0 14px 14px}.meal.open .mbody{display:block}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:14px}
.tile.wide .tt{margin-top:0}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sugs:empty{display:none}
.sug{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.sug small{opacity:.7}
.hint:empty{display:none}
.toprow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.toprow:first-of-type{border-top:0}
.rk{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tn{flex:1;display:flex;flex-direction:column;min-width:0}.tn small{color:var(--dim);font-size:12.5px}
.cnt{font-weight:800;color:var(--accent)}
.rcp.used{opacity:.6}.rcp.used h3,.rcp.used li{text-decoration:line-through}.rcp.used .bk{text-decoration:line-through}
.hintinline{font-weight:400;color:var(--dim);text-transform:none;letter-spacing:0}
.ingchips{margin:2px 0 8px}.ingchips:empty{display:none}.ingchips .chip{padding:6px 11px;font-size:14px}
.updbtn{width:100%;margin:0 0 10px}
.reusebox{align-items:flex-start;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--accent-soft)}
.reusebox small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;font-weight:400}
.meal.reuse .mnum{background:var(--hl);color:#2d2600}
.tag{font-size:11.5px;font-weight:700;background:var(--hl);color:#2d2600;border-radius:99px;padding:2px 8px;vertical-align:middle;white-space:nowrap}
.secthead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.secthead h2{font-size:18px}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:6px}

/* aisle planner */
.arow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .ord{width:24px;color:var(--dim);font-weight:700;font-size:13px}
.arow .an{flex:1;font-weight:600}.arow .an small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.unkrow{padding:10px 0;border-bottom:1px solid var(--line)}.unkrow:last-child{border-bottom:0}
.krow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.krow .kk{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.krow select{width:auto;max-width:140px;padding:6px 8px;font-size:14px}

/* recipes */
.rcp h3{font-size:18px}.rcp .bk{color:var(--dim);font-size:13.5px;margin:2px 0 10px}
.rcp ul{margin:0;padding-left:20px}.rcp li{padding:2px 0}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;max-width:88vw;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:18px}
.sticky .btn{box-shadow:0 6px 18px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="app">
  <section id="s-home" class="screen active"><div id="v-home"></div></section>
  <section id="s-shopping" class="screen"><div id="v-shopping"></div></section>
  <section id="s-planner" class="screen"><div id="v-planner"></div></section>
  <section id="s-aisles" class="screen"><div id="v-aisles"></div></section>
  <section id="s-recipes" class="screen"><div id="v-recipes"></div></section>
  <section id="s-history" class="screen"><div id="v-history"></div></section>
  <section id="s-settings" class="screen"><div id="v-settings"></div></section>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
